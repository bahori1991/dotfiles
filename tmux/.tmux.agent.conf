# Inner tmux: Cursor Agent tabs in the right pane (mirrors .tmux.term.conf)

set -g default-terminal "tmux-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g escape-time 0
set -g renumber-windows on
set -g history-limit 50000
setw -g mode-keys vi
setw -g automatic-rename on

# scroll: prefer Agent CLI viewport when alternate screen is active
bind -n PageUp if-shell -F -t = "#{alternate_on}" "send-keys PageUp" "copy-mode -e"
bind -n PageDown if-shell -F -t = "#{alternate_on}" "send-keys PageDown" "send-keys -M"
bind -n M-p copy-mode -e
bind -n WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" \
  "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind -n WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" 'send-keys -M'

# match outer tmux extended-key handling (Windows Terminal CSI u)
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-256color:extkeys'
set -as terminal-features 'xterm*:extkeys'

# tab bar at the top of the agent pane
set -g status-position top
set -g status-style 'fg=#757575,bg=#252526'
set -g status-left '#[fg=#569cd6] agent '
set -g status-right '%H:%M'
setw -g window-status-format ' #{window_index}:#{window_name} '
setw -g window-status-current-format ' #{window_index}:#{window_name} '
setw -g window-status-current-style 'fg=#d4d4d4,bg=#1e1e1e'
setw -g window-status-style 'fg=#757575,bg=#252526'

AGENT_TAB="/home/bahori1991/.config/dotfiles/scripts/agent-tab.sh"

# IME off on Escape (same as outer tmux / zenhan.lua)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n Escape if-shell "$is_vim" 'send-keys Escape' \
  'run-shell -b "/home/bahori1991/.config/dotfiles/scripts/zenhan-off.sh #{pane_id}"'

bind-key -T copy-mode-vi  'q' send-keys -X cancel
bind-key -T copy-mode-vi  'g' send-keys -X history-top
bind-key -T copy-mode-vi  'G' send-keys -X history-bottom

# agent tab navigation (Alt/Meta, same chord scheme as terminal tabs)
bind -n M-t new-window -n agent "$AGENT_TAB new"
bind -n M-c new-window -n continue "$AGENT_TAB continue"
bind -n M-s new-window -n sessions "$AGENT_TAB sessions"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-] next-window
bind -n M-[ previous-window
bind -n M-w confirm-before -p "kill agent tab ##{window_index}? (y/n)" kill-window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

# resize outer nvim-dev pane (this tmux runs inside the agent pane)
bind-key -n -r C-S-h run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-resize-outer.sh L"
bind-key -n -r C-S-j run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-resize-outer.sh D"
bind-key -n -r C-S-k run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-resize-outer.sh U"
bind-key -n -r C-S-l run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-resize-outer.sh R"

bind r source-file ~/.tmux.agent.conf \; display-message "agent tabs reloaded"
