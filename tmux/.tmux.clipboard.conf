# WSL: copy-mode yank -> Windows clipboard (win32yank, same as Neovim)

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"

bind-key -T copy-mode v send-keys -X begin-selection
bind-key -T copy-mode C-v send-keys -X rectangle-toggle
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
