# Inner tmux: terminal tabs inside the bottom pane (VS Code terminal panel style)

set -g default-terminal "tmux-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g escape-time 0
set -g renumber-windows on
setw -g automatic-rename on

# tab bar at the top of the terminal pane
set -g status-position top
set -g status-style 'fg=#757575,bg=#252526'
set -g status-left ''
set -g status-right '%H:%M'
setw -g window-status-format ' #{window_index}:#{window_name} '
setw -g window-status-current-format ' #{window_index}:#{window_name} '
setw -g window-status-current-style 'fg=#d4d4d4,bg=#1e1e1e'
setw -g window-status-style 'fg=#757575,bg=#252526'

# IME off on Escape (same as outer tmux / zenhan.lua)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n Escape if-shell "$is_vim" 'send-keys Escape' \
  'run-shell -b "/home/bahori1991/.config/dotfiles/scripts/zenhan-off.sh #{pane_id}"'

# terminal tab navigation
bind -n M-t new-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-] next-window
bind -n M-[ previous-window
bind -n M-w confirm-before -p "kill terminal tab ##{window_index}? (y/n)" kill-window
bind -n M-r command-prompt -I "#W" "rename-window '%%'"

bind r source-file ~/.tmux.term.conf \; display-message "terminal tabs reloaded"
