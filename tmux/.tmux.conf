source-file ~/.tmux.clipboard.conf

# prefix: C-Space (free C-b for Neovim page-up / neoscroll)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g mouse on
set -g escape-time 0
set -g renumber-windows on

# Ctrl+Shift vs Ctrl (Windows Terminal sends CSI u via terminal/settings.json)
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm-256color:extkeys'
set -as terminal-features 'xterm*:extkeys'

# send focus events to Neovim (required by focus-dim.lua)
set -g focus-events on

# active pane: gray[100]/gray[950]; inactive: gray[400]/gray[900]
set -g window-active-style 'fg=#d4d4d4,bg=#1e1e1e'
set -g window-style 'fg=#757575,bg=#252526'
set -g pane-border-style 'fg=#454545'
set -g pane-active-border-style 'fg=#569cd6'

# status bar (session info only; terminal tabs live in the bottom pane)
set -g status-position top
set -g status-style 'fg=#757575,bg=#252526'
set -g status-format[0] '#[align=left]#{session_name}#[align=right]%H:%M'

# pane navigation (vim-tmux-navigator)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# prefix [ : inner copy-mode in Agent/Terminal panes; skip in Neovim
bind-key [ if-shell -F '#{pane_current_command} == tmux' \
  'send-prefix ; send-keys [' \
  "if-shell \"$is_vim\" 'display-message \"copy-mode: use Agent/Terminal pane\"' 'copy-mode'"

# PageUp/PageDown: forward to inner tmux in nested panes
bind-key -n PageUp if-shell -F '#{pane_current_command} == tmux' 'send-keys PageUp' \
  "if-shell \"$is_vim\" '' 'copy-mode -e'"
bind-key -n PageDown if-shell -F '#{pane_current_command} == tmux' 'send-keys PageDown' 'send-keys -M'

# mouse wheel: forward to inner tmux (outer scrollback has no bash/agent history)
bind-key -n WheelUpPane if-shell -F '#{pane_current_command} == tmux' 'send-keys -M' \
  "if-shell -F -t = '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"
bind-key -n WheelDownPane if-shell -F '#{pane_current_command} == tmux' 'send-keys -M' 'send-keys -M'

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# pane navigation in copy mode (e.g. Agent pane scrollback)
bind-key -T copy-mode     'C-h' select-pane -L
bind-key -T copy-mode     'C-j' select-pane -D
bind-key -T copy-mode     'C-k' select-pane -U
bind-key -T copy-mode     'C-l' select-pane -R
bind-key -T copy-mode-vi  'C-h' select-pane -L
bind-key -T copy-mode-vi  'C-j' select-pane -D
bind-key -T copy-mode-vi  'C-k' select-pane -U
bind-key -T copy-mode-vi  'C-l' select-pane -R
bind-key -T copy-mode-vi  'C-\' select-pane -l

# IME off on Escape (WSL + zenhan); skip nested terminal/agent tmux panes
bind-key -n Escape if-shell "$is_vim" 'send-keys Escape' \
  "if-shell -F '#{pane_current_command} == tmux' 'send-keys Escape' \
  'run-shell -b \"/home/bahori1991/.config/dotfiles/scripts/zenhan-off.sh #{pane_id}\"'"

bind-key -n C-a if-shell -F '#{session_name} == nvim-dev' \
  'run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-toggle-agent-pane.sh"' \
  'send-keys C-a'

bind-key -n C-S-h run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-resize-pane.sh L"
bind-key -n C-S-j run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-resize-pane.sh D"
bind-key -n C-S-k run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-resize-pane.sh U"
bind-key -n C-S-l run-shell -b "/home/bahori1991/.config/dotfiles/scripts/tmux-resize-pane.sh R"

bind r source-file ~/.tmux.conf \; display-message "reloaded"
