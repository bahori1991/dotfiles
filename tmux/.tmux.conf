setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g mouse on
set -g escape-time 0
set -g renumber-windows on

# send focus events to Neovim (required by focus-dim.lua)
set -g focus-events on

# active pane: colors.lua bg/fg; inactive pane: grayish
set -g window-active-style 'fg=#d4d4d4,bg=#1e1e1e'
set -g window-style 'fg=#757575,bg=#252526'
set -g pane-border-style 'fg=#454545'
set -g pane-active-border-style 'fg=#569cd6'

# status bar (session info only; terminal tabs live in the bottom pane)
set -g status-position top
set -g status-style 'fg=#757575,bg=#252526'
set -g status-format[0] '#[align=left]#{session_name}#[align=right]%H:%M'

# pane navigation (vim-tmux-navigator)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# pane navigation in copy mode (e.g. Agent pane scrollback)
bind-key -T copy-mode     'C-h' select-pane -L
bind-key -T copy-mode     'C-j' select-pane -D
bind-key -T copy-mode     'C-k' select-pane -U
bind-key -T copy-mode     'C-l' select-pane -R
bind-key -T copy-mode-vi  'C-h' select-pane -L
bind-key -T copy-mode-vi  'C-j' select-pane -D
bind-key -T copy-mode-vi  'C-k' select-pane -U
bind-key -T copy-mode-vi  'C-l' select-pane -R
bind-key -T copy-mode-vi  'C-\' select-pane -l

# IME off on Escape (WSL + zenhan); Neovim panes use zenhan.lua via send-keys
bind-key -n Escape if-shell "$is_vim" 'send-keys Escape' \
  'run-shell -b "/home/bahori1991/.config/dotfiles/scripts/zenhan-off.sh #{pane_id}"'

bind -r C-S-h resize-pane -L 5
bind -r C-S-j resize-pane -D 5
bind -r C-S-k resize-pane -U 5
bind -r C-S-l resize-pane -R 5

bind r source-file ~/.tmux.conf \; display-message "reloaded"
