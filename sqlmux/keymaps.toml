[keys.tree]
"j" = "tree.down"  # Down
"k" = "tree.up"  # Up
"gg" = "tree.top"  # First item
"G" = "tree.bottom"  # Last item
"l" = "tree.expand"  # Expand
"h" = "tree.collapse"  # Collapse / up a level
"<Down>" = "tree.down"  # Down
"<Up>" = "tree.up"  # Up
"<Right>" = "tree.expand"  # Expand
"<Left>" = "tree.collapse"  # Collapse / up a level
"<CR>" = "tree.open"  # Open
"t" = "tree.open.tab"  # Open
"/" = "tree.filter"  # Filter
"<Esc>" = "tree.refilter"  # Back to the filter input
"R" = "tree.refresh"  # Refresh the tables
"dd" = "tree.delete"  # Delete query file, table or view
"s" = "jump.start"  # Jump to a character on the screen
":" = "palette.open"  # Command palette
";" = "palette.sql"  # Quick SQL
# "" = "tree.fold"  # Fold the sidebar
